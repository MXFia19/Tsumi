# XcodeGen spec: the Xcode project is generated from this file (xcodegen generate),
# so no .xcodeproj is committed. Built by .github/workflows/ios-native.yml.
name: Tsumi
options:
  bundleIdPrefix: org.tsumi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.5"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Native WebRTC (binary xcframework of Google libwebrtc), used by Watch Together data channels.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 156.0.0
targets:
  Tsumi:
    type: application
    platform: iOS
    sources:
      - path: Tsumi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tsumi.app
        PRODUCT_NAME: Tsumi
        INFOPLIST_FILE: Tsumi/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        CODE_SIGNING_ALLOWED: NO
        # Discord Social SDK: its C API is imported with `import CDiscord`, our own Clang module
        # (Vendor/CDiscord/module.modulemap). The framework's own module is never imported: its umbrella
        # header also includes discordpp.h, which is C++.
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor/CDiscord"
    dependencies:
      - package: WebRTC
        product: WebRTC
      # Discord Social SDK (rich presence), linked and embedded for its symbols only. Proprietary: not in the
      # repository, CI unpacks it into Vendor/ before `xcodegen generate` (.github/workflows/ios-native.yml).
      - framework: Vendor/discord_partner_sdk.xcframework
        embed: true
        codeSign: true
