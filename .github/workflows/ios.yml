name: iOS Build
# Builds an unsigned .ipa to sideload (for example with Sideloadly).
# macOS minutes count 10x against the free Actions quota of private repositories,
# so this workflow only runs when started by hand (Actions > iOS Build > Run workflow).
on:
  workflow_dispatch:
env:
  NODE_VERSION: '22.21.1'
  PNPM_VERSION: '10.15.1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'  # the desktop runtime is not needed for the iOS build
jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./capacitor
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        env:
          NODE_ENV: production
        run: pnpm run build:web
      # The Xcode project is generated on each build instead of being committed.
      - name: Add iOS platform
        env:
          NODE_ENV: production  # read by capacitor.config.js: bundle the app instead of the dev server
        run: npx cap add ios
      - name: Configure the iOS app
        run: |
          PLIST=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          # same version number as the desktop app
          VERSION=$(node -p "require('../electron/package.json').version")
          $PB -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          $PB -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$PLIST"
          # tsumi:// links (Watch Together invites, AniList/MAL login); shiru:// for older links
          $PB -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLName string org.tsumi.app" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string tsumi" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:1 string shiru" "$PLIST"
          # keep the sound playing when the screen locks
          $PB -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          $PB -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          # some extensions return plain http streams
          $PB -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          $PB -c "Print" "$PLIST"
      - name: Sync Capacitor plugins
        env:
          NODE_ENV: production
        run: npx cap sync ios
      - name: Check the app is bundled (no dev server)
        run: |
          if grep -q '"url"' ios/App/App/capacitor.config.json; then
            echo 'capacitor.config.json still points to a server URL:'; cat ios/App/App/capacitor.config.json; exit 1
          fi
      - name: Build archive (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath "$PWD/App.xcarchive" \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p output/Payload
          cp -R App.xcarchive/Products/Applications/App.app output/Payload/
          cd output
          zip -qr Tsumi-unsigned.ipa Payload
          rm -rf Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tsumi-ios-ipa
          path: capacitor/output/*.ipa
          if-no-files-found: error
          retention-days: 30
