name: iOS Native Build
# Native SwiftUI app (ios-native/). The Xcode project is generated by XcodeGen.
# Produces an unsigned .ipa to sideload (Sideloadly, Feather...). Releases are published by release.yml, which
# calls this workflow (workflow_call).
on:
  workflow_dispatch:
  workflow_call:  # Used by release.yml
    inputs:
      marketing-version:
        description: 'CFBundleShortVersionString of the build (the release version); empty keeps the one of project.yml'
        type: string
        required: false
        default: ''
    secrets:
      DISCORD_SDK_KEY:
        required: false
      TRAKT_CLIENT_ID:
        required: false
  push:
    branches:
      - 'main'
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-native.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./ios-native
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      # Discord Social SDK (rich presence). Proprietary, so never committed: its iOS part is an asset of a release of
      # this repository (discord_partner_sdk.xcframework, cdiscord.h, License-Notices.txt), encrypted
      # (openssl enc -aes-256-cbc -md sha256) with the DISCORD_SDK_KEY secret. The xcframework goes to Vendor/
      # (framework dependency of project.yml) and cdiscord.h next to Vendor/CDiscord/module.modulemap (the CDiscord
      # Clang module imported by Swift).
      - name: Download Discord Social SDK
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_SDK_KEY: ${{ secrets.DISCORD_SDK_KEY }}
        run: |
          set -eu
          if [ -z "${DISCORD_SDK_KEY:-}" ]; then
            echo "::error::The DISCORD_SDK_KEY secret is not set: the Discord Social SDK can't be decrypted"
            exit 1
          fi
          sdk="$RUNNER_TEMP/discord-sdk"
          rm -rf "$sdk"
          gh release download discord-social-sdk-1.10.19337 --repo "$GITHUB_REPOSITORY" --pattern "discord-social-sdk-ios.zip.enc" --dir "$sdk"
          openssl enc -d -aes-256-cbc -md sha256 -in "$sdk/discord-social-sdk-ios.zip.enc" -out "$sdk/discord-social-sdk-ios.zip" -pass env:DISCORD_SDK_KEY
          rm "$sdk/discord-social-sdk-ios.zip.enc"
          unzip -q "$sdk/discord-social-sdk-ios.zip" -d "$sdk/unzipped"
          xcframework=$(find "$sdk/unzipped" -type d -name discord_partner_sdk.xcframework -not -path '*/__MACOSX/*' -prune | head -n 1)
          header=$(find "$sdk/unzipped" -type f -name cdiscord.h -not -path '*/__MACOSX/*' -not -path '*.xcframework/*' | head -n 1)
          if [ -z "$header" ] && [ -n "$xcframework" ]; then
            header=$(find "$xcframework" -type f -name cdiscord.h | head -n 1)
          fi
          if [ -z "$xcframework" ] || [ -z "$header" ]; then
            echo "discord-social-sdk-ios.zip has no discord_partner_sdk.xcframework or cdiscord.h"
            exit 1
          fi
          rm -rf Vendor/discord_partner_sdk.xcframework
          cp -R "$xcframework" Vendor/discord_partner_sdk.xcframework
          cp "$header" Vendor/CDiscord/cdiscord.h
          notices=$(find "$sdk/unzipped" -type f -name License-Notices.txt -not -path '*/__MACOSX/*' | head -n 1)
          if [ -n "$notices" ]; then cp "$notices" Vendor/License-Notices.txt; fi
          ls Vendor Vendor/CDiscord Vendor/discord_partner_sdk.xcframework
      - name: Generate Xcode project
        run: xcodegen generate
      # TRAKT_CLIENT_ID: build-time Client ID of the Trakt integration (empty when the secret doesn't exist).
      - name: Build archive (unsigned)
        env:
          RELEASE_VERSION: ${{ inputs.marketing-version }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Tsumi.xcodeproj \
                     -scheme Tsumi \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath "$PWD/build/Tsumi.xcarchive" \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     ${RELEASE_VERSION:+MARKETING_VERSION=$RELEASE_VERSION} 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: unre|BUILD|ARCHIVE" || true
          test -d build/Tsumi.xcarchive/Products/Applications/Tsumi.app
          test -d build/Tsumi.xcarchive/Products/Applications/Tsumi.app/Frameworks/discord_partner_sdk.framework
          test -d build/Tsumi.xcarchive/Products/Applications/Tsumi.app/PlugIns/TsumiWidgets.appex
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Tsumi.xcarchive/Products/Applications/Tsumi.app/Info.plist
      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build/xcodebuild.log | sort | uniq | head -150 || true
      - name: Package IPA
        run: |
          set -eu
          mkdir -p output/Payload
          cp -R build/Tsumi.xcarchive/Products/Applications/Tsumi.app output/Payload/
          # Ad-hoc signature carrying the App Group entitlement (Entitlements/*.entitlements), so the re-signers
          # that keep or adapt the binary's entitlements (AltStore / SideStore, TrollStore, Sideloadly) give the app
          # and its widget extension a shared container. Feather / zsign replace it with their profile's anyway.
          app=output/Payload/Tsumi.app
          for item in "$app"/Frameworks/*; do
            [ -e "$item" ] || continue
            codesign --force --sign - --timestamp=none "$item"
          done
          for appex in "$app"/PlugIns/*.appex; do
            [ -e "$appex" ] || continue
            codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements Entitlements/TsumiWidgets.entitlements "$appex"
          done
          codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements Entitlements/Tsumi.entitlements "$app"
          codesign -d --entitlements - "$app/PlugIns/TsumiWidgets.appex"
          codesign -d --entitlements - "$app"
          cd output
          zip -qr Tsumi-native-unsigned.ipa Payload
          rm -rf Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tsumi-ios-native-ipa
          path: ios-native/output/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios-native/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
