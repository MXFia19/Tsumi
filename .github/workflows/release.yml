name: Release
# Builds the Windows installer and the iOS IPA (main.yml and ios-native.yml, called as reusable workflows) and
# publishes them as the GitHub Release of a tag, marked as the latest release:
# - Windows: the NSIS installer + latest.yml + .blockmap. electron-updater (electron/src/main/updater.js) reads
#   latest.yml from the latest release of this repository.
# - iOS: Tsumi.ipa (stable name: https://github.com/MXFia19/Tsumi/releases/latest/download/Tsumi.ipa), then
#   docs/source.json (Feather / AltStore source on GitHub Pages) gets the new version, committed to main.
#
# Release: bump the version (electron/package.json and ios-native/project.yml, checked to match), push it, then push a tag "vX.Y.Z" with
# the same version: git tag v1.2.3 && git push perso v1.2.3
# Test: Actions > Release > Run workflow with "draft" checked creates a draft release (no tag is created until a
# draft is published, and docs/source.json is not committed). Delete the draft afterwards.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release (vX.Y.Z). For a draft, the tag is only created if the draft is published.'
        type: string
        required: true
        default: 'v0.0.0-test'
      draft:
        description: 'Draft (test run): build and upload to a draft release, without updating docs/source.json'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
      # A published release must have the version of the app: electron-updater compares the version written in
      # latest.yml (electron/package.json) with the installed one, and the iOS app compares the tag with its
      # CFBundleShortVersionString (the IPA is built with MARKETING_VERSION = this version).
      - name: Check the tag against the app version
        id: version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid tag: $TAG"
            exit 1
          fi
          app_version=$(node -p "require('./electron/package.json').version")
          ios_version=$(tr -d '\r' < ios-native/project.yml | sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' | head -n 1)
          draft=false
          if [ "$DRAFT" = true ]; then draft=true; fi
          version="${TAG#v}"
          if [ "$version" != "$app_version" ]; then
            if [ "$draft" = true ]; then
              echo "::warning::Draft $TAG: the apps are built as version $app_version (electron/package.json)"
              version="$app_version"
            else
              echo "::error::Tag $TAG does not match the version of electron/package.json ($app_version). Bump the version first."
              exit 1
            fi
          fi
          # PC and iPhone ship the same version: a forgotten MARKETING_VERSION bump stops the release here (the Windows
          # build, main.yml, checks the same, drafts included).
          if [ "$ios_version" != "$app_version" ]; then
            echo "::error::ios-native/project.yml has MARKETING_VERSION ${ios_version:-missing} but electron/package.json is $app_version. Bump both."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG, version $version, draft: $draft"

  windows:
    name: Windows
    needs: prepare
    uses: ./.github/workflows/main.yml
    secrets: inherit

  ios:
    name: iOS
    needs: prepare
    uses: ./.github/workflows/ios-native.yml
    with:
      marketing-version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  release:
    name: Publish the release
    needs: [prepare, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      DRAFT: ${{ needs.prepare.outputs.draft }}
    steps:
      - name: Download the Windows installer
        uses: actions/download-artifact@v4
        with:
          name: tsumi-windows-installer
          path: artifacts/windows
      - name: Download the IPA
        uses: actions/download-artifact@v4
        with:
          name: tsumi-ios-native-ipa
          path: artifacts/ios
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/windows/* release/
          ipas=(artifacts/ios/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then echo "::error::Expected one IPA, got: ${ipas[*]}"; exit 1; fi
          mv "${ipas[0]}" release/Tsumi.ipa
          # electron-updater downloads the file named in latest.yml, next to it in the release.
          installer=$(sed -n 's/^path: *//p' release/latest.yml)
          test -f "release/$installer"
          ls -l release
      # Generated release notes since the previous app release (vX.Y.Z tags only: the build-dependency releases are
      # left out), marked as the latest release unless it's a draft. A draft for a tag that does not exist yet points
      # at this commit: the tag is only created if the draft is published.
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name' | grep -E '^v[0-9]' | grep -vxF "$TAG" | head -n 1 || true)
          notes=(--title "Tsumi $TAG" --generate-notes)
          if [ -n "$previous" ]; then notes+=(--notes-start-tag "$previous"); fi
          echo "Previous release: ${previous:-none}"
          if gh release view "$TAG" "${args[@]}" > /dev/null 2>&1; then
            echo "Release $TAG already exists (re-run): uploading the files again"
            gh release upload "$TAG" release/* --clobber "${args[@]}"
            if [ "$DRAFT" != true ]; then gh release edit "$TAG" --draft=false --latest "${args[@]}"; fi
          elif [ "$DRAFT" = true ]; then
            gh release create "$TAG" release/* "${args[@]}" "${notes[@]}" --draft --target "$GITHUB_SHA"
          else
            gh release create "$TAG" release/* "${args[@]}" "${notes[@]}" --latest --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" "${args[@]}" --json url,isDraft,assets --jq '"\(.url) draft=\(.isDraft)", (.assets[] | "  \(.name) \(.size)")'

  source:
    name: Update the iOS source
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DRAFT: ${{ needs.prepare.outputs.draft }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # The script comes from the released commit; docs/source.json is updated on the default branch (GitHub Pages).
      - name: Check out the released commit
        uses: actions/checkout@v6
        with:
          path: released
          sparse-checkout: |
            .github/scripts
            docs
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: pages
          sparse-checkout: docs
      - name: Add the release to docs/source.json
        run: |
          set -euo pipefail
          source=pages/docs/source.json
          if [ ! -f "$source" ]; then
            if [ "$DRAFT" != true ]; then echo "::error::docs/source.json is not on $DEFAULT_BRANCH"; exit 1; fi
            echo "docs/source.json is not on $DEFAULT_BRANCH yet: dry run on the copy of the released commit"
            source=released/docs/source.json
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt,body,assets > "$RUNNER_TEMP/release.json"
          node released/.github/scripts/update-source.mjs "$source" "$RUNNER_TEMP/release.json" "$GITHUB_REPOSITORY" "$VERSION"
          git -C "${source%/docs/source.json}" diff -- docs/source.json
      # Commits made with the workflow token start no workflow (and docs/ is ignored by the build workflows anyway).
      - name: Commit docs/source.json
        if: needs.prepare.outputs.draft != 'true'
        working-directory: pages
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/source.json; then echo 'docs/source.json is up to date'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/source.json
          git commit -m "Update the iOS source to $TAG [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then exit 0; fi
            git pull --rebase origin "$DEFAULT_BRANCH"
          done
          echo "::error::Could not push docs/source.json"
          exit 1
