name: Windows Build
# Builds the Windows installer and attaches it to the run as an artifact (installer + latest.yml + blockmap).
# Releases are published by release.yml, which calls this workflow (workflow_call).
on:
  workflow_dispatch:  # Allows manual triggering
  workflow_call:      # Used by release.yml
    secrets:
      DISCORD_SDK_KEY:
        required: false
      TRAKT_CLIENT_ID:
        required: false
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'ios-native/**'
      - '.github/workflows/ios-native.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
permissions:
  contents: read
env:
  NODE_VERSION: '22.21.1'
  PNPM_VERSION: '10.15.1'
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      # The Windows app and the iOS app ship with the same version (release.yml tags both): electron/package.json and
      # MARKETING_VERSION in ios-native/project.yml must be bumped together.
      - name: Check the app versions match
        shell: bash
        run: |
          set -euo pipefail
          app_version=$(node -p "require('./electron/package.json').version")
          ios_version=$(tr -d '\r' < ios-native/project.yml | sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' | head -n 1)
          echo "electron/package.json: $app_version, ios-native/project.yml: ${ios_version:-missing}"
          if [ "$app_version" != "$ios_version" ]; then
            echo "::error::Version mismatch: electron/package.json is $app_version but MARKETING_VERSION in ios-native/project.yml is ${ios_version:-missing}. Bump both."
            exit 1
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Unit tests of the pure logic (plain node scripts, no framework): every tracked *.test.mjs, before the long build.
      - name: Run unit tests
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for file in $(git ls-files '*.test.mjs'); do
            echo "::group::$file"
            if ! node "$file"; then
              failed=1
              echo "::error file=$file::Unit tests failed"
            fi
            echo "::endgroup::"
          done
          exit $failed
      # The native shutdown handler is prebuilt (N-API), so no Visual Studio is needed.
      - name: Add prebuilt native module
        shell: bash
        run: |
          dest=$(ls -d node_modules/.pnpm/@paymoapp+electron-shutdown-handler@*/node_modules/@paymoapp/electron-shutdown-handler)
          mkdir -p "$dest/build/Release"
          cp electron/prebuilt/PaymoWinShutdownHandler.node "$dest/build/Release/"
      # Tsumi uses an Electron build with extra codecs (HEVC, AC3...). Its original
      # download mirror is gone, so the zip is kept as an asset of a release of this repo.
      - name: Download Electron with codecs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download electron-codecs-39.2.7 --pattern "electron-v39.2.7-win32-x64.zip" --dir electron-dist
      # The Discord Social SDK (presence without the Discord app) is proprietary: the release asset is encrypted
      # (openssl enc -aes-256-cbc -md sha256) with the DISCORD_SDK_KEY secret and decrypted here with Git's openssl
      # (bash). The DLL is shipped next to the app (electron-builder extraResources).
      - name: Download Discord Social SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_SDK_KEY: ${{ secrets.DISCORD_SDK_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_SDK_KEY:-}" ]; then
            echo "::error::The DISCORD_SDK_KEY secret is not set: the Discord Social SDK can't be decrypted"
            exit 1
          fi
          gh release download discord-social-sdk-1.10.19337 --pattern "discord-social-sdk-windows.zip.enc" --dir discord-sdk-download
          openssl enc -d -aes-256-cbc -md sha256 -in discord-sdk-download/discord-social-sdk-windows.zip.enc -out discord-sdk-download/discord-social-sdk-windows.zip -pass env:DISCORD_SDK_KEY
          rm discord-sdk-download/discord-social-sdk-windows.zip.enc
      - name: Unpack Discord Social SDK
        run: |
          Expand-Archive discord-sdk-download/discord-social-sdk-windows.zip -DestinationPath discord-sdk-download/extracted
          New-Item -ItemType Directory -Force electron/discord-social-sdk | Out-Null
          Get-ChildItem discord-sdk-download/extracted -Recurse -Include discord_partner_sdk.dll, License-Notices.txt | Copy-Item -Destination electron/discord-social-sdk
          if (-not (Test-Path electron/discord-social-sdk/discord_partner_sdk.dll)) { throw 'discord_partner_sdk.dll is missing from the release asset' }
      - name: Build app (webpack)
        working-directory: electron
        env:
          NODE_ENV: production
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: pnpm run web:build
      # electron-builder is called directly: "pnpm run build -- <args>" would forward
      # a literal "--" and electron-builder would ignore the options after it.
      # "--publish never": release.yml uploads the files itself. latest.yml and the .blockmap are still written
      # (from the "publish" config of electron/package.json): they are what electron-updater reads.
      - name: Build installer (Windows x64)
        working-directory: electron
        shell: bash  # PowerShell splits "-c.npmRebuild=false" into "-c" ".npmRebuild=false"
        run: pnpm exec electron-builder --win nsis --x64 --publish never --config.npmRebuild=false --config.electronDist=../electron-dist
      # Without these two files the app silently falls back to the Discord app's local RPC.
      # koffi.node is copied by extraResources: electron-builder leaves out koffi's platform package (@koromix/*).
      - name: Check Discord Social SDK files in the app
        working-directory: electron/dist/win-unpacked/resources
        run: |
          foreach ($file in 'discord-social-sdk/discord_partner_sdk.dll', 'koffi/win32_x64/koffi.node') {
            if (-not (Test-Path $file)) { throw "$file is missing from the packaged app" }
          }
      # Auto-update: latest.yml (version, file name, sha512) and the .blockmap (differential download) go to the
      # release; app-update.yml (inside the app) says where to look for updates.
      - name: Check update files
        working-directory: electron/dist
        shell: bash
        run: |
          set -euo pipefail
          ls -l *-installer.exe *-installer.exe.blockmap latest.yml
          cat latest.yml
          cat win-unpacked/resources/app-update.yml
          grep -q 'owner: MXFia19' win-unpacked/resources/app-update.yml
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tsumi-windows-installer
          path: |
            electron/dist/*-installer.exe
            electron/dist/*-installer.exe.blockmap
            electron/dist/latest.yml
          if-no-files-found: error
          retention-days: 30
