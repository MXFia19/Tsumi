<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join Watch Together · Tsumi</title>
  <meta name="description" content="Join a Watch Together lobby in Tsumi.">
  <meta property="og:title" content="Join Watch Together">
  <meta property="og:description" content="Open this link to watch together in Tsumi.">
  <meta property="og:image" content="https://mxfia19.github.io/Tsumi/icon.png">
  <link rel="icon" href="../icon.png">
  <style>
    :root { color-scheme: dark; --bg: #0f1013; --card: #1c1d21; --text: #f2f2f3; --muted: #9a9ba3; --accent: #3db4f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--card); border-radius: 16px; padding: 28px 24px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.35rem; margin: 14px 0 6px; }
    p { color: var(--muted); margin: 0 0 18px; }
    .btn { display: block; width: 100%; padding: 13px 16px; border-radius: 10px; border: 0; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; margin-top: 10px; }
    .primary { background: var(--accent); color: #06121a; }
    .secondary { background: #2a2b31; color: var(--text); }
    code { font-family: ui-monospace, Consolas, monospace; background: #2a2b31; padding: 2px 6px; border-radius: 6px; word-break: break-all; }
    .small { font-size: .85rem; margin-top: 16px; }
    .error { color: #ff8a8a; }
  </style>
</head>
<body>
  <main>
    <img src="../icon.png" alt="Tsumi">
    <h1 id="title">Join Watch Together</h1>
    <p id="text">Opening Tsumi…</p>
    <a id="open" class="btn primary" href="#">Open in Tsumi</a>
    <button id="copy" class="btn secondary" type="button">Copy lobby code</button>
    <a class="btn secondary" href="../">I don't have Tsumi: download it</a>
    <p class="small">Lobby code: <code id="code">—</code></p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search)
      var raw = params.get('c') || params.get('code') || location.hash.replace(/^#/, '')
      var code = /^[A-Za-z0-9]{6,64}$/.test(raw || '') ? raw : null
      var open = document.getElementById('open')
      var copy = document.getElementById('copy')
      var text = document.getElementById('text')
      if (!code) {
        document.getElementById('title').textContent = 'Invalid link'
        text.textContent = 'This link does not contain a valid lobby code.'
        text.className = 'error'
        open.style.display = 'none'
        copy.style.display = 'none'
        return
      }
      var link = 'tsumi://w2g/' + code
      document.getElementById('code').textContent = code
      open.href = link
      copy.addEventListener('click', function () {
        var done = function () { copy.textContent = 'Code copied' }
        if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, function () {})
      })
      // Try to open the app right away; if nothing happens, the buttons stay available.
      setTimeout(function () { location.href = link }, 150)
      setTimeout(function () { text.textContent = 'If Tsumi didn\'t open, tap the button below.' }, 1500)
    })()
  </script>
</body>
</html>
